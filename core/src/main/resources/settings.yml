
changes:
  # Как часто (в секундах) сохранять изменённые чанки в БД, не дожидаясь их выгрузки; 0 — только при выгрузке
  autosave: 300

database:
  # Тип базы данных: sqlite, mysql, postgresql
  type: sqlite
  # Для sqlite — путь к файлу (пусто = plugins/NaturalTracker/data.db)
  # Для mysql/postgresql — host:port/database
  url: ''
  user: root
  password: ''

  # Ограничивать ли размер таблицы. Если выключить, таблица растёт без предела.
  # Если включить снова, чанки сверх limit_size удалятся при запуске или перезагрузке плагина
  limit: true
  # Максимальное количество чанков в таблице, при превышении удаляются дольше всех не обновлявшиеся
  limit_size: 100_000

  pool:
    min_size: 2
    max_size: 10
    # Таймаут получения соединения из пула в секундах
    timeout_time: 10
    # Таймаут запроса в секундах
    timeout_query: 10
