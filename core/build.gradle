plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.7'
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.20-R0.1-SNAPSHOT")

    implementation("io.agroal:agroal-api:3.2.1") // Agroal (29.08.26)
    implementation("io.agroal:agroal-pool:3.2.1")
    implementation("org.postgresql:postgresql:42.7.5") // PostgreSQL JDBC (Paper его не содержит)
}

shadowJar {
    getDestinationDirectory().set(new File("D:\\Minecraft\\Servers\\Paper 1.20.1\\plugins\\"))
    archiveFileName = "NaturalTracker-${project.version}.jar"
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion)
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}